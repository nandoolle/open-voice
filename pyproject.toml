[project]
name = "open-voice"
version = "0.1.0"
description = "Local voice loop (TTS/STT) for Claude Code via herdr"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fernando Ollé", email = "fernando.olle@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "kokoro>=0.9.4",
    "numpy>=1.26",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn>=0.52.4",
    # macOS: Metal via MLX (STT + router)
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
    # Linux: CTranslate2 (STT) + llama.cpp (router)
    "faster-whisper>=1.1.0; sys_platform == 'linux'",
    "llama-cpp-python>=0.3.0; sys_platform == 'linux'",
    "huggingface-hub>=0.23; sys_platform == 'linux'",
]

[project.scripts]
open-voice-tts-daemon = "open_voice.tts_daemon:main"
open-voice-stop-hook = "open_voice.stop_hook:main"
open-voice-listen = "open_voice.listen:main"
open-voice-on = "open_voice.toggle:voice_on"
open-voice-off = "open_voice.toggle:voice_off"
open-voice-prompt-hook = "open_voice.prompt_hook:main"
open-voice-setup = "open_voice.setup:main"
open-voice-config = "open_voice.config:cli"
open-voice-route = "open_voice.listen:route_cli"
open-voice-uninstall = "open_voice.uninstall:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
